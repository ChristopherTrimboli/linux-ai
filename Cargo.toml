[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "desktop/src-tauri"]
# The desktop crate requires system WebKitGTK libraries to compile, so it is
# excluded from the default build. Build it explicitly with `cargo tauri`
# (or `cargo build -p linux-ai-desktop`) once those libraries are installed.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cjft/linux-ai"
authors = ["linux-ai contributors"]

[workspace.dependencies]
la-core = { path = "crates/core" }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
# keyring 4 is a CLI/sample rebuilt on keyring-core with a different API and a
# vendored libdbus; 3.x is the latest line with the stable `Entry` API + a
# pure-Rust secret-service backend.
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
directories = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1"
sysinfo = "0.39"
walkdir = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
